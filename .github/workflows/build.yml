name: Build WorkTracker.exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest test_core
      - name: Make icon
        run: python make_icon.py
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name WorkTracker --icon icon.ico --hidden-import pystray._win32 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker
          path: dist/WorkTracker.exe
